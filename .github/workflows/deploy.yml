name: Publicar dashboard en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: paginas
  cancel-in-progress: true
jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Instalar dependencias
        run: npm install
      - name: Construir el proyecto
        run: npm run build
      - name: Preparar archivos para publicar
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: construir
    steps:
      - name: Publicar en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@v4
